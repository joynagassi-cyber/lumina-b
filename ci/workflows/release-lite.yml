name: Release APK signé

# Version minimale à installer dans .github/workflows/ : produit l'APK + l'AAB
# signés et publie la GitHub Release. Les workflows complets (android-ci.yml,
# android-release.yml, bootstrap-keystore.yml) ajoutent tests, vérification de
# signature et génération du keystore.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          bash scripts/generate-debug-keystore.sh
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signé
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          ./gradlew assembleRelease bundleRelease --no-configuration-cache --stacktrace

      - name: Publier les artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lumina-apk-signe
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          FILES="app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab"
          gh release upload "$TAG" $FILES --clobber 2>/dev/null \
            || gh release create "$TAG" $FILES --title "Lumina-beta ${TAG#v}" \
                 --notes-file CHANGELOG.md --verify-tag
          gh release edit "$TAG" --draft=false 2>/dev/null || true
