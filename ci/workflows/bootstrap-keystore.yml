name: Bootstrap keystore (à lancer UNE seule fois)

# Génère le keystore de signature release dans le runner GitHub, puis publie :
#   - my-upload-key.jks              (le keystore, à sauvegarder hors dépôt)
#   - my-upload-key.jks.base64       (contenu à coller dans le secret KEYSTORE_BASE64)
#   - credentials.txt                (mot de passe généré aléatoirement)
#
# Le mot de passe n'apparaît jamais dans les logs : il est uniquement dans
# l'artefact téléchargeable (visible par les personnes ayant accès au dépôt).
# L'artefact expire après 3 jours.
on:
  workflow_dispatch:
    inputs:
      validity_years:
        description: "Durée de validité (années)"
        required: false
        default: '30'
      dname:
        description: "Distinguished Name (C=, O=, CN=...)"
        required: false
        default: 'CN=Lumina-beta, OU=Mobile, O=Lumina, L=Kandi, ST=Alibori, C=BJ'

permissions:
  contents: read

jobs:
  bootstrap:
    name: Générer le keystore de signature
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Générer la clé
        env:
          DNAME: ${{ inputs.dname }}
          YEARS: ${{ inputs.validity_years }}
        run: |
          set -euo pipefail
          ALIAS="upload"
          KEYSTORE="my-upload-key.jks"

          # Mot de passe aléatoire, sans caractères problématiques dans les shells/YAML
          PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          echo "::add-mask::$PASSWORD"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 \
            -validity $(( YEARS * 365 )) \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "$DNAME"

          chmod 600 "$KEYSTORE"
          base64 -w0 "$KEYSTORE" > "$KEYSTORE.base64"

          {
            echo "Lumina-beta — identifiants du keystore de signature"
            echo "==================================================="
            echo "Fichier              : $KEYSTORE"
            echo "Alias                : $ALIAS   (imposé par app/build.gradle.kts — ne pas changer)"
            echo "STORE_PASSWORD       : $PASSWORD"
            echo "KEY_PASSWORD         : $PASSWORD   (identique, contrainte PKCS12)"
            echo "SHA-256              : $(keytool -list -v -keystore "$KEYSTORE" -storepass "$PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')"
            echo
            echo "Secrets GitHub à créer : KEYSTORE_BASE64 (contenu du .base64), STORE_PASSWORD, KEY_PASSWORD"
          } > credentials.txt

          # Résumé (sans le mot de passe)
          {
            echo "## Keystore généré"
            echo
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Alias | \`$ALIAS\` |"
            echo "| SHA-256 | \`$(keytool -list -v -keystore "$KEYSTORE" -storepass "$PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')\` |"
            echo
            echo "### Étapes suivantes"
            echo "1. Télécharger l'artefact **lumina-upload-keystore** (contient \`.jks\`, \`.base64\`, \`credentials.txt\`)."
            echo "2. Sauvegarder le \`.jks\` + le mot de passe hors du dépôt (gestionnaire de mots de passe)."
            echo "3. Créer les secrets : \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_PASSWORD\`."
            echo "4. Supprimer l'artefact du run (Actions > run > Artifacts) une fois les secrets en place."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: lumina-upload-keystore
          path: |
            my-upload-key.jks
            my-upload-key.jks.base64
            credentials.txt
          if-no-files-found: error
          retention-days: 3
