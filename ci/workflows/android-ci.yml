name: Android CI

# Build de vérification : compile l'app, lance les tests unitaires et publie un APK debug.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dorg.gradle.daemon=false
  JAVA_VERSION: '21'

jobs:
  build-debug:
    name: Compilation + tests + APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accepter les licences + installer les plateformes
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # compileSdk = 36 (minorApiLevel 1) — on tente 36.1 puis 36.
          sdkmanager "platform-tools" "build-tools;36.0.0" > /dev/null || true
          sdkmanager "platforms;android-36.1" > /dev/null 2>&1 \
            || sdkmanager "platforms;android-36" > /dev/null 2>&1 \
            || echo "::warning::Plateforme 36 non préinstallée — AGP tentera le téléchargement automatique."

      - name: Setup Gradle (cache + wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore de debug (convention AI Studio)
        run: bash scripts/generate-debug-keystore.sh

      - name: Informations Gradle / SDK
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Tests unitaires (Room + formateur monétaire)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemblage APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
